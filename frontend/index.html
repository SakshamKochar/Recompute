<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5ef" />
    <meta
      name="description"
      content="ReCompute. Find the next best life for every GPU server. Asset passports, fleet decisions and plain economics."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ReCompute · Value, redirected.</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="ticker" class="market-tape waiting" role="region" aria-label="GPU rental tape. Hover or focus a price to pause.">
      <a class="tape-mark" href="#market"><span class="tape-dot" aria-hidden="true"></span><span class="tape-kicker"><span class="tape-kicker-long">Rental asks</span><span class="tape-kicker-short">Asks</span></span></a>
      <div class="tape-viewport" aria-hidden="true"><div class="tape-track"><div class="tape-group"><span class="tape-item tape-empty"><span class="tape-name">Reading the book</span></span></div></div></div>
      <span class="tape-status"><b>…</b><small>One moment</small></span>
    </div>
    <div id="experience"></div>
    <div class="shell">
      <header class="studio-header">
        <div class="studio-brand-row">
          <a class="studio-wordmark" href="#home">ReCompute<span>®</span></a>
          <span class="studio-divider"></span>
          <span class="studio-label">DECISION STUDIO</span>
          <div class="studio-account" id="mode-switch"></div>
        </div>
        <div class="studio-nav-row">
          <nav id="nav" aria-label="Studio sections"></nav>
        </div>
      </header>
      <div id="mode-banner"></div>
      <main id="main" tabindex="-1"></main>
      <footer>
        <span>ReCompute® &nbsp; Value, redirected.</span>
        <span id="footer-model">Every asset has a next chapter. &nbsp; ↗</span>
      </footer>
    </div>
    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
